{% extends "layout.html" %}
{% block title %}Inicio{% endblock %}

{% block content %}
  <div class="p-5 bg-white rounded shadow-sm text-center">
    <h1>{{ app_name }}</h1>
    <p class="lead">Plantilla base de Flask con MySQL, login, roles y permisos.</p>
    {% if current_user.is_authenticated %}
      <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">Ir a mi panel</a>
    {% else %}
      <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Iniciar sesión</a>
      <a class="btn btn-outline-primary" href="{{ url_for('auth.register') }}">Crear cuenta</a>
    {% endif %}
  </div>
{% endblock %}
